name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ty check
      - run: uv run pytest
      - run: uv build
      - name: Verify clean wheel install
        shell: bash
        run: |
          WHEEL=$(find dist -name '*.whl' -print -quit)
          GBIZINFO_API_TOKEN=test uv run --isolated --no-project --with "$WHEEL" python - <<'PY'
          import asyncio
          from gbizinfo_mcp import create_server

          assert len(asyncio.run(create_server().list_tools())) == 19
          PY
